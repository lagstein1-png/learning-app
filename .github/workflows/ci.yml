name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: learning-app-tts:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name tts -p 8080:8080 -e NODE_ENV=production learning-app-tts:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = "1"
          curl -fsS -X POST http://127.0.0.1:8080/process-text \
            -H 'content-type: application/json' \
            -d '{"text":"At a junction with a stop sign you must stop.","language":"en"}' | grep -q planToken
          docker rm -f tts
