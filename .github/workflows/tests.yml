name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # No API key and no network are needed: the suite fakes the Messages
      # endpoint and runs the MCP server in-process and over stdio.
      - run: python -m pytest -q
